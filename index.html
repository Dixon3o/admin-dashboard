<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="node_modules/modern-normalize/modern-normalize.css">
    <link rel="stylesheet" href="style.css">  
    <title>Admin dashboard</title>
</head>
<body>
    
    <div class="main-container">
        <div class="left-side">
            <div class="dashboard">
                <object class="dashboardPic" data="svgs/dashboard.svg" width="80" height="80"> </object>
                <p class="dashboardText"><a href="">Dashboard</a></p>
            </div>
            <div class="home">
                <object class="homePic" data="svgs/home.svg" width="25" height="25"> </object>
                <p class="homeText"><a href="">Home</a></p>
            </div>
            <div class="profile">
                <object class="profilePic" data="svgs/profile.svg" width="25" height="25"> </object>
                <p class="profileText"><a href="">Profile</a></p>
            </div>
            <div class="messages">
                <object class="messagesPic" data="svgs/message.svg" width="25" height="25"> </object>
                <p class="messagesText"><a href="">Messages</a></p>
            </div>
            <div class="history">
                <object class="historyPic" data="svgs/history.svg" width="25" height="25"> </object>
                <p class="historyText"><a href="">History</a></p>
            </div>
            <div class="tasks">
                <object class="tasksPic" data="svgs/tasks.svg" width="25" height="25"> </object>
                <p class="tasksText"><a href="">Tasks</a></p>
            </div>
            <div class="communities">
                <object class="communitiesPic" data="svgs/communities.svg" width="25" height="25"> </object>
                <p class="communitiesText"><a href="">Communities</a></p>
            </div>
            <div class="settings">
                <object class="settingsPic" data="svgs/settings.svg" width="25" height="25"> </object>
                <p class="settingsText"><a href="">Settings</a></p>
            </div>
            <div class="support">
                <object class="supportPic" data="svgs/support.svg" width="25" height="25"> </object>
                <p class="supportText"><a href="">Support</a></p>
            </div>
            <div class="privacy">
                <object class="privacyPic" data="svgs/privacy.svg" width="25" height="25"> </object>
                <p class="privacyText"><a href="">Privacy</a></p>
            </div>
        </div>
        <div class="right-side">
            <div class="header">
                <div class="left-top">
                    <div class="search">
                        <object class="searchPic" data="svgs/search.svg" width="25" height="25"> </object>
                        <input type="search" class="searchInput">
                    </div>
                    <div class="underSearch">
                        <object class="avatarPic" data="svgs/avatar.svg" width="80" height="80"> </object>
                        <div class="avatarText">
                            <p style="font-size: 12px">Hi there,</p>
                            <p style="font-size: 20px">Morgan Oakley (@morgan)</p>
                        </div>
                    </div>
                </div>
                <div class="right-top">
                    <div class="upper">
                        <object class="bellPic" data="svgs/bell.svg" width="25" height="25"> </object>
                        <object class="avatarPic2" data="svgs/avatar.svg" width="40" height="40"> </object>
                        <p class="topRightName" style="font-size: 17px">Morgan Oakley</p>
                    </div>
                    <div class="bottom">
                        <button type="button" href="#">New</button>
                        <button type="button" href="#">Upload</button>
                        <button type="button" href="#">Share</button>
                    </div>
                </div>
            </div>
            <div class="main-grid">
                
            </div>
        </div>
    </div>

</body>
</html>
